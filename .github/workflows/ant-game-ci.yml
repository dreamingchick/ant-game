name: Ant Game · Automated Browser Verification and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ant-game-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify game and installable PWA (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Generate required 192px and 512px app icons
        run: python scripts/build_icons.py
      - name: Check JavaScript syntax and static asset contracts
        run: |
          node --check balance.js
          node --check game.js
          node --check pwa.js
          node --check sw.js
          python tests/structure.py
          python tests/test_balance_gate.py
      - name: Run browser regression, animation and PWA install checks
        run: |
          set -o pipefail
          mkdir -p test-results
          python tests/regression.py 2>&1 | tee test-results/regression.log
          python tests/v11.py 2>&1 | tee test-results/v11.log
          python tests/balance_validation.py 2>&1 | tee test-results/balance-validation.log
          python tests/motion.py 2>&1 | tee test-results/motion.log
          python tests/pwa.py 2>&1 | tee test-results/pwa.log
      - name: Save evidence (screenshots and logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ant-game-browser-report
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  balance-qa:
    name: Gate release on growth balance (<=10%)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ant-game-browser-report
          path: test-results
      - name: Verify current-source evidence and growth spread
        run: python tests/balance_gate.py

  publish:
    name: Deploy verified installable PWA to GitHub Pages
    needs: [verify, balance-qa]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate app icons for the published site
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build_icons.py
      - name: Prepare app shell and PWA artifact
        run: |
          mkdir -p dist
          cp index.html style.css balance.js game.js pwa.js sw.js manifest.json dist/
          cp -R icons dist/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Verify public Pages game, manifest, service worker and icons
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build expected icons from the same checked source
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build_icons.py
      - name: Confirm live files exactly match verified sources
        env:
          PAGES_URL: https://dreamingchick.github.io/ant-game/
        run: python tests/verify_live.py
