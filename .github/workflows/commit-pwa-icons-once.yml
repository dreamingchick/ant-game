name: Commit the generated PWA icons (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commit-pwa-icons-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow and render ant-themed launch icons
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python scripts/build_icons.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for filename, size in [('ant-192.png', 192), ('ant-512.png', 512), ('ant-maskable-512.png', 512)]:
              icon = Path('icons') / filename
              with Image.open(icon) as image:
                  assert image.format == 'PNG' and image.size == (size, size)
              print(f'VERIFIED {icon} ({size}x{size})')
          PY
      - name: Commit actual PNG icons to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/ant-192.png icons/ant-512.png icons/ant-maskable-512.png
          if git diff --cached --quiet; then
            echo 'Icons already committed'
          else
            git commit -m "Add generated PWA icon PNG assets to main"
            git push origin HEAD:main
          fi
